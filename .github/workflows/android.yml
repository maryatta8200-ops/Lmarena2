name: Android verification

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;28.2.13676358"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - uses: gradle/actions/setup-gradle@v6

      - name: Test Rust tokenizer bridge
        run: cargo test --manifest-path native/ai-core/Cargo.toml

      - name: Build native Android tokenizer libraries
        run: ./scripts/build-native.sh

      - name: Test, lint, and build both debug APK flavors
        run: >-
          ./gradlew
          test
          :app:testOfflineDebugUnitTest
          :app:testResearchDebugUnitTest
          :app:lint
          :app:assembleOfflineDebug
          :app:assembleResearchDebug
          --console=plain

      - name: Verify APK signatures and flavor permissions
        shell: bash
        run: |
          set -euo pipefail
          offline_apk="app/build/outputs/apk/offline/debug/app-offline-debug.apk"
          research_apk="app/build/outputs/apk/research/debug/app-research-debug.apk"
          test -s "$offline_apk"
          test -s "$research_apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$offline_apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$research_apk"
          offline_permissions=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump permissions "$offline_apk")
          research_permissions=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump permissions "$research_apk")
          if [[ "$offline_permissions" == *"android.permission.INTERNET"* ]]; then
            echo "Offline APK unexpectedly requests INTERNET."
            exit 1
          fi
          if [[ "$research_permissions" != *"android.permission.INTERNET"* ]]; then
            echo "Research APK does not declare its required INTERNET permission."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: localmed-debug-apks
          path: |
            app/build/outputs/apk/offline/debug/app-offline-debug.apk
            app/build/outputs/apk/research/debug/app-research-debug.apk
          if-no-files-found: error
          retention-days: 7
