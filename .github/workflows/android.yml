name: Android verification

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK platform 37
        run: sdkmanager "platforms;android-37.0"

      - name: Install Android Build Tools 37.0.0
        run: sdkmanager "build-tools;37.0.0"

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - uses: gradle/actions/setup-gradle@v6

      - name: Test Rust tokenizer bridge
        run: cargo test --manifest-path native/ai-core/Cargo.toml

      - name: Build native Android tokenizer libraries
        shell: bash
        run: |
          if ./scripts/build-native.sh > native-build.log 2>&1; then
            cat native-build.log
          else
            cat native-build.log
            while IFS= read -r line; do
              escaped=${line//'%'/'%25'}
              escaped=${escaped//$'\r'/'%0D'}
              echo "::error::$escaped"
            done < <(tail -n 40 native-build.log)
            exit 1
          fi

      - name: Test, lint, and build both debug APK flavors
        shell: bash
        run: |
          set +e
          ./gradlew test :app:testOfflineDebugUnitTest :app:testResearchDebugUnitTest :app:lint \
            :app:assembleOfflineDebug :app:assembleResearchDebug --console=plain --stacktrace > android-build.log 2>&1
          gradle_status=$?
          set -e

          if [[ "$gradle_status" -eq 0 ]]; then
            cat android-build.log
          else
            echo "Gradle exited with status $gradle_status. Runner memory after failure:"
            free -h || true
            cat android-build.log
            error_summary=$(tail -n 100 android-build.log)
            error_summary=${error_summary//'%'/'%25'}
            error_summary=${error_summary//$'\r'/'%0D'}
            error_summary=${error_summary//$'\n'/'%0A'}
            echo "::error title=Gradle build failure::$error_summary"
            {
              echo '### Gradle failure details'
              echo '```text'
              tail -n 100 android-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$gradle_status"
          fi

      - name: Upload Gradle diagnostic log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: localmed-gradle-failure-log
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Verify APK signatures and flavor permissions
        shell: bash
        run: |
          set -euo pipefail
          offline_apk="app/build/outputs/apk/offline/debug/app-offline-debug.apk"
          research_apk="app/build/outputs/apk/research/debug/app-research-debug.apk"
          test -s "$offline_apk"
          test -s "$research_apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$offline_apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$research_apk"
          offline_permissions=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump permissions "$offline_apk")
          research_permissions=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump permissions "$research_apk")
          if [[ "$offline_permissions" == *"android.permission.INTERNET"* ]]; then
            echo "Offline APK unexpectedly requests INTERNET."
            exit 1
          fi
          if [[ "$research_permissions" != *"android.permission.INTERNET"* ]]; then
            echo "Research APK does not declare its required INTERNET permission."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: localmed-debug-apks
          path: |
            app/build/outputs/apk/offline/debug/app-offline-debug.apk
            app/build/outputs/apk/research/debug/app-research-debug.apk
          if-no-files-found: error
          retention-days: 7
