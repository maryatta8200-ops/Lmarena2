name: Build Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --console=plain

      # --- Play Store release signing (only when secrets are configured) ---
      - name: Configure release signing
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            echo "ANDROID_KEYSTORE_FILE=${{ github.workspace }}/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release signing configured with alias '$KEY_ALIAS'."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets found — release APK will be unsigned."
          fi

      - name: Build signed release APK
        if: steps.sign.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --console=plain

      - name: Build unsigned release APK (fallback)
        if: steps.sign.outputs.signed == 'false'
        run: ./gradlew assembleRelease --stacktrace --console=plain || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lmarena-agent-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (manual / tag)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Use the pushed tag for the release, or a default for manual runs.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v1.0.0"
          fi
          gh release delete "$TAG" --yes 2>/dev/null || true
          files=""
          # Prefer signed release APK; if none, fall back to debug.
          for f in app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk; do
            [ -e "$f" ] && files="$files $f"
          done
          gh release create "$TAG" \
            --title "LM Arena Agent $TAG" \
            --notes "Android APK generated automatically by GitHub Actions. See the README for how to point the app at your LMArena backend." \
            $files

      - name: Summarize
        if: always()
        run: |
          if ls app/build/outputs/apk/debug/*.apk >/dev/null 2>&1; then
            echo "### APK built ✔" >> "$GITHUB_STEP_SUMMARY"
            echo "Download it from the artifacts section of this workflow run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### APK not produced — see the build log above." >> "$GITHUB_STEP_SUMMARY"
          fi
