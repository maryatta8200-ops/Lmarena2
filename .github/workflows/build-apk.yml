name: Build Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lmarena-agent-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Parse APK metadata
        if: always()
        id: apkmeta
        run: |
          echo "debug_apk=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1 || echo '')" >> "$GITHUB_OUTPUT"

      - name: Summarize
        if: always()
        run: |
          if [ -n "${{ steps.apkmeta.outputs.debug_apk }}" ]; then
            size=$(du -h "${{ steps.apkmeta.outputs.debug_apk }}" | cut -f1)
            echo "### APK built ✔" >> "$GITHUB_STEP_SUMMARY"
            echo "Debug APK: \`${{ steps.apkmeta.outputs.debug_apk }}\` ($size)" >> "$GITHUB_STEP_SUMMARY"
            echo "Download it from the artifacts section of this workflow run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### APK not produced — see the build log above." >> "$GITHUB_STEP_SUMMARY"
          fi
