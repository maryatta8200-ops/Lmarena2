name: Build Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        id: build
        run: ./gradlew assembleDebug --stacktrace --console=plain

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace --console=plain || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lmarena-agent-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # --- Diagnostics: if the build failed, create a GitHub issue with the tail of the log
      # so the authoring agent (which cannot reach the Azure-hosted logs) can see the error.
      - name: Report build failure
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          # Re-run the failing command to capture output, since the log console isn't
          # available to the authoring agent.
          ./gradlew assembleDebug --stacktrace --console=plain > /tmp/build.log 2>&1 || true
          {
            echo '### APK build failed'
            echo ''
            echo '```text'
            tail -n 500 /tmp/build.log
            echo '```'
          } > /tmp/issue.md
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "ci: APK build failure (run $GITHUB_RUN_ID)" \
            --body-file /tmp/issue.md > /tmp/issue_url.txt 2>/tmp/issue_err.txt || true
          echo "issue_url=$(cat /tmp/issue_url.txt 2>/dev/null)"

      - name: Summarize
        if: always()
        run: |
          if ls app/build/outputs/apk/debug/*.apk >/dev/null 2>&1; then
            echo "### APK built ✔" >> "$GITHUB_STEP_SUMMARY"
            echo "Download it from the artifacts section of this workflow run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### APK not produced — see diagnostics above." >> "$GITHUB_STEP_SUMMARY"
          fi
