name: Build Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --console=plain

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace --console=plain || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lmarena-agent-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (manual / tag)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete v1.0.0 --yes 2>/dev/null || true
          gh release create v1.0.0 \
            --title "LM Arena Agent v1.0.0" \
            --notes "Android APK generated automatically by GitHub Actions. See the README for how to point the app at your LMArena backend." \
            app/build/outputs/apk/debug/*.apk \
            app/build/outputs/apk/release/*.apk

      - name: Summarize
        if: always()
        run: |
          if ls app/build/outputs/apk/debug/*.apk >/dev/null 2>&1; then
            echo "### APK built ✔" >> "$GITHUB_STEP_SUMMARY"
            echo "Download it from the artifacts section of this workflow run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### APK not produced — see the build log above." >> "$GITHUB_STEP_SUMMARY"
          fi
