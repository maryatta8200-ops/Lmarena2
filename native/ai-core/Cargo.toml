[package]
name = "relay-ai-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "=0.21.1"
once_cell = "=1.21.3"
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
